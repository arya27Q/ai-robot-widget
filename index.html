<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Robot Reminder</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="mode-center" data-theme="cyan" data-size="normal">
    <main class="widget-root" id="widget-root">
      <!-- SPEECH BUBBLE ZONE (Above robot in Center mode, flips Below robot in Top-Dock mode) -->
      <section class="bubble-zone" aria-live="polite">
        <!-- Reminder Alert Bubble -->
        <div class="speech-bubble" id="speech-bubble" role="alertdialog" aria-hidden="true">
          <div class="bubble-header">
            <span class="bubble-dot"></span>
            <span class="bubble-label" id="bubble-label">PENGINGAT</span>
            <span class="bubble-queue" id="bubble-queue" hidden>+1</span>
            <button
              type="button"
              class="bubble-chime-btn"
              id="btn-replay-chime"
              title="Putar ulang suara"
              aria-label="Putar ulang suara"
            >
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
            </button>
          </div>
          <p class="bubble-message" id="bubble-message">Waktunya istirahat sejenak!</p>
          <div class="bubble-actions">
            <button type="button" class="btn-bubble btn-done" id="btn-complete">
              Selesai
            </button>
            <button type="button" class="btn-bubble btn-snooze" id="btn-snooze">
              Snooze 5m
            </button>
          </div>
          <div class="bubble-tail" aria-hidden="true"></div>
        </div>

        <!-- Soft Auto-Greeting / Status Bubble (auto-dismisses, never blocks reminder alerts) -->
        <div class="greeting-bubble" id="greeting-bubble" aria-hidden="true">
          <span class="greeting-text" id="greeting-text">Halo! Siap nemenin hari ini.</span>
          <div class="greeting-tail" aria-hidden="true"></div>
        </div>
      </section>

      <!-- MIDDLE ZONE: Minimalist AI Robot Visor & Hidden Hover Controls -->
      <section class="robot-stage" id="robot-stage">
        <div class="robot-float-wrapper" id="robot-float-wrapper">
          <!-- Acoustic Sound-Wave Ripple Rings behind Visor -->
          <div class="sound-rings" id="sound-rings" aria-hidden="true">
            <span class="sound-ring ring-1"></span>
            <span class="sound-ring ring-2"></span>
            <span class="sound-ring ring-3"></span>
          </div>

          <!-- Floating Zzz Sleep Glyphs -->
          <div class="sleep-zzz" id="sleep-zzz" aria-hidden="true">
            <span class="zzz z1">z</span>
            <span class="zzz z2">z</span>
            <span class="zzz z3">Z</span>
          </div>

          <!-- Neon Confetti Celebration Burst Layer -->
          <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

          <!-- Drag region directly on visor; decorative children use pointer-events: none -->
          <div
            class="robot-visor"
            id="robot-visor"
            data-tauri-drag-region
            title="Seret untuk pindah • Klik 2x atau elus untuk menyapa"
          >
            <div class="visor-scanlines" aria-hidden="true"></div>
            <div class="visor-reflection" aria-hidden="true"></div>
            <div class="visor-rim-light" aria-hidden="true"></div>

            <!-- Animated Raindrops on Visor Glass (when Ambient Rain is ON) -->
            <div class="rain-overlay" id="rain-overlay" aria-hidden="true">
              <span class="raindrop r1"></span>
              <span class="raindrop r2"></span>
              <span class="raindrop r3"></span>
              <span class="raindrop r4"></span>
              <span class="raindrop r5"></span>
              <span class="raindrop r6"></span>
            </div>

            <!-- Minimalist Top HUD inside Visor (Clock & Active Pomodoro Countdown) -->
            <div class="visor-hud" id="visor-hud" aria-hidden="true">
              <span class="visor-clock" id="visor-clock">00:00</span>
              <span class="visor-pomo-pill" id="visor-pomo-pill" hidden>25:00</span>
              <span class="visor-mic-dot" id="visor-mic-dot" hidden></span>
            </div>

            <!-- Cheek blush glow for happy state -->
            <div class="blush blush-left" aria-hidden="true"></div>
            <div class="blush blush-right" aria-hidden="true"></div>

            <!-- Cyber Sunglasses Overlay (Cool Mode) -->
            <div class="cyber-shades" aria-hidden="true">
              <div class="shade-lens shade-left"></div>
              <div class="shade-bridge"></div>
              <div class="shade-lens shade-right"></div>
            </div>

            <!-- Interactive OLED Mini-Scene Overlay (Suit, Flower, Movie, Ghost, Scared, Gaming, Music) -->
            <div class="visor-scene" id="visor-scene" aria-hidden="true">
              <!-- Rock (Batu) -->
              <svg class="scene-svg scene-rock" viewBox="0 0 64 64" fill="none">
                <rect x="14" y="20" width="36" height="28" rx="12" stroke="currentColor" stroke-width="4" fill="currentColor" fill-opacity="0.18"/>
                <path d="M22 20 V15 C22 12 27 12 27 15 V20 M30 20 V14 C30 11 35 11 35 14 V20 M38 20 V15 C38 12 43 12 43 15 V20" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/>
                <path d="M16 32 H34" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/>
              </svg>

              <!-- Scissors (Gunting) -->
              <svg class="scene-svg scene-scissors" viewBox="0 0 64 64" fill="none">
                <path d="M20 12 L34 38 M44 12 L30 38" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
                <circle cx="22" cy="46" r="8" stroke="currentColor" stroke-width="4" fill="currentColor" fill-opacity="0.16"/>
                <circle cx="42" cy="46" r="8" stroke="currentColor" stroke-width="4" fill="currentColor" fill-opacity="0.16"/>
                <circle cx="32" cy="34" r="2.8" fill="currentColor"/>
              </svg>

              <!-- Paper (Kertas) -->
              <svg class="scene-svg scene-paper" viewBox="0 0 64 64" fill="none">
                <rect x="16" y="10" width="32" height="44" rx="6" stroke="currentColor" stroke-width="4" fill="currentColor" fill-opacity="0.16"/>
                <line x1="23" y1="22" x2="41" y2="22" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
                <line x1="23" y1="32" x2="41" y2="32" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
                <line x1="23" y1="42" x2="35" y2="42" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
              </svg>

              <!-- Blooming Flower (Bunga Baper) -->
              <svg class="scene-svg scene-flower" viewBox="0 0 64 64" fill="none">
                <path d="M32 34 V56" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
                <path d="M32 47 C24 46 21 41 21 38 C26 38 30 41 32 47 Z" fill="#34d399"/>
                <path d="M32 45 C40 44 43 39 43 36 C38 36 34 39 32 45 Z" fill="#34d399"/>
                <circle cx="32" cy="14" r="7.5" fill="#ff6ec7"/>
                <circle cx="43" cy="22" r="7.5" fill="#ff6ec7"/>
                <circle cx="39" cy="34" r="7.5" fill="#f472b6"/>
                <circle cx="25" cy="34" r="7.5" fill="#f472b6"/>
                <circle cx="21" cy="22" r="7.5" fill="#ff6ec7"/>
                <circle cx="32" cy="25" r="7" fill="#fde047"/>
              </svg>

              <!-- Movie Night (3D Glasses + Popcorn Glow) -->
              <svg class="scene-svg scene-movie" viewBox="0 0 88 52" fill="none">
                <rect x="4" y="12" width="34" height="24" rx="7" fill="#ef4444" fill-opacity="0.72" stroke="#f8fafc" stroke-width="3"/>
                <rect x="50" y="12" width="34" height="24" rx="7" fill="#06b6d4" fill-opacity="0.78" stroke="#f8fafc" stroke-width="3"/>
                <path d="M38 22 H50" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="16" cy="20" r="3" fill="#ffffff" fill-opacity="0.6"/>
                <circle cx="62" cy="20" r="3" fill="#ffffff" fill-opacity="0.6"/>
              </svg>

              <!-- Spooky Ghost (Nakutin BOO!) -->
              <svg class="scene-svg scene-ghost" viewBox="0 0 64 64" fill="none">
                <path d="M14 54 V28 C14 16 22 9 32 9 C42 9 50 16 50 28 V54 L43 48 L36 54 L32 49 L28 54 L21 48 Z" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="3.8" stroke-linejoin="round"/>
                <path d="M21 25 L28 29 L21 31 Z" fill="#ff4d6d"/>
                <path d="M43 25 L36 29 L43 31 Z" fill="#ff4d6d"/>
                <path d="M23 39 Q32 45 41 39" stroke="#ff4d6d" stroke-width="3.2" stroke-linecap="round"/>
              </svg>

              <!-- Scared / Shocked Face -->
              <svg class="scene-svg scene-scared" viewBox="0 0 84 56" fill="none">
                <circle cx="24" cy="26" r="14" stroke="#7bf8ff" stroke-width="4" fill="#7bf8ff" fill-opacity="0.16"/>
                <circle cx="24" cy="26" r="4" fill="#ffffff"/>
                <circle cx="60" cy="26" r="14" stroke="#7bf8ff" stroke-width="4" fill="#7bf8ff" fill-opacity="0.16"/>
                <circle cx="60" cy="26" r="4" fill="#ffffff"/>
                <path d="M35 45 Q42 39 49 45" stroke="#7bf8ff" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M74 10 C74 10 79 17 79 20 C79 23 76.8 25 74 25 C71.2 25 69 23 69 20 C69 17 74 10 74 10 Z" fill="#38bdf8"/>
              </svg>

              <!-- Retro Arcade Gaming (Mabar) -->
              <svg class="scene-svg scene-gaming" viewBox="0 0 72 52" fill="none">
                <rect x="8" y="12" width="56" height="30" rx="12" stroke="currentColor" stroke-width="3.8" fill="currentColor" fill-opacity="0.18"/>
                <path d="M22 21 V33 M16 27 H28" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/>
                <circle cx="48" cy="23" r="3.4" fill="#f43f5e"/>
                <circle cx="55" cy="30" r="3.4" fill="#fde047"/>
              </svg>

              <!-- Mini Concert Music Notes -->
              <svg class="scene-svg scene-music" viewBox="0 0 72 56" fill="none">
                <path d="M24 40 V14 L52 9 V35" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="24" y1="22" x2="52" y2="17" stroke="currentColor" stroke-width="3.5"/>
                <ellipse cx="18" cy="41" rx="7" ry="5.2" fill="currentColor"/>
                <ellipse cx="46" cy="36" rx="7" ry="5.2" fill="currentColor"/>
              </svg>
            </div>

            <!-- 60fps GPU-accelerated Eye Rig -->
            <div class="eyes-rig" id="eyes-rig" aria-hidden="true">
              <!-- Left Eye -->
              <div class="eye-slot eye-left">
                <div class="eye-normal">
                  <div class="eye-lid"></div>
                </div>
                <div class="eye-tear"></div>
                <svg class="eye-happy" viewBox="0 0 38 26" fill="none">
                  <path
                    d="M5 21 C 10 5, 28 5, 33 21"
                    stroke="currentColor"
                    stroke-width="6.5"
                    stroke-linecap="round"
                  />
                </svg>
                <svg class="eye-sleep" viewBox="0 0 38 20" fill="none">
                  <path
                    d="M5 6 C 12 16, 26 16, 33 6"
                    stroke="currentColor"
                    stroke-width="4.5"
                    stroke-linecap="round"
                  />
                </svg>
                <svg class="eye-love" viewBox="0 0 32 30" fill="currentColor">
                  <path d="M16 27.5 C16 27.5 3 19.2 3 10.5 C3 6.2 6.4 3 10.4 3 C13 3 15 4.4 16 6.2 C17 4.4 19 3 21.6 3 C25.6 3 29 6.2 29 10.5 C29 19.2 16 27.5 16 27.5 Z" />
                </svg>
                <svg class="eye-star" viewBox="0 0 36 36" fill="currentColor">
                  <path d="M18 2 L22 14 L34 18 L22 22 L18 34 L14 22 L2 18 L14 14 Z" />
                </svg>
                <svg class="eye-dizzy" viewBox="0 0 36 36" fill="none">
                  <path
                    d="M18 18 C18 14, 23 14, 23 18 C23 23, 14 24, 13 18 C12 11, 26 9, 28 18 C30 27, 10 30, 8 18"
                    stroke="currentColor"
                    stroke-width="3.6"
                    stroke-linecap="round"
                  />
                </svg>
                <svg class="eye-shy" viewBox="0 0 30 30" fill="none">
                  <path
                    d="M7 6 L23 15 L7 24"
                    stroke="currentColor"
                    stroke-width="5.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>

              <!-- Right Eye -->
              <div class="eye-slot eye-right">
                <div class="eye-normal">
                  <div class="eye-lid"></div>
                </div>
                <svg class="eye-happy" viewBox="0 0 38 26" fill="none">
                  <path
                    d="M5 21 C 10 5, 28 5, 33 21"
                    stroke="currentColor"
                    stroke-width="6.5"
                    stroke-linecap="round"
                  />
                </svg>
                <svg class="eye-sleep" viewBox="0 0 38 20" fill="none">
                  <path
                    d="M5 6 C 12 16, 26 16, 33 6"
                    stroke="currentColor"
                    stroke-width="4.5"
                    stroke-linecap="round"
                  />
                </svg>
                <svg class="eye-love" viewBox="0 0 32 30" fill="currentColor">
                  <path d="M16 27.5 C16 27.5 3 19.2 3 10.5 C3 6.2 6.4 3 10.4 3 C13 3 15 4.4 16 6.2 C17 4.4 19 3 21.6 3 C25.6 3 29 6.2 29 10.5 C29 19.2 16 27.5 16 27.5 Z" />
                </svg>
                <svg class="eye-star" viewBox="0 0 36 36" fill="currentColor">
                  <path d="M18 2 L22 14 L34 18 L22 22 L18 34 L14 22 L2 18 L14 14 Z" />
                </svg>
                <svg class="eye-dizzy" viewBox="0 0 36 36" fill="none">
                  <path
                    d="M18 18 C18 14, 23 14, 23 18 C23 23, 14 24, 13 18 C12 11, 26 9, 28 18 C30 27, 10 30, 8 18"
                    stroke="currentColor"
                    stroke-width="3.6"
                    stroke-linecap="round"
                  />
                </svg>
                <svg class="eye-shy" viewBox="0 0 30 30" fill="none">
                  <path
                    d="M23 6 L7 15 L23 24"
                    stroke="currentColor"
                    stroke-width="5.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>

            <!-- Real-time Audio-Reactive Voice Equalizer inside Visor -->
            <div class="voice-wave" id="voice-wave" aria-hidden="true">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
            </div>

            <!-- Neon Pomodoro Progress Bar along bottom inner rim -->
            <div class="visor-progress-track" id="visor-progress-track" aria-hidden="true">
              <div class="visor-progress-fill" id="visor-progress-fill"></div>
            </div>
          </div>

          <!-- Soft ambient floating shadow below visor -->
          <div class="robot-shadow" aria-hidden="true"></div>
        </div>

        <!-- Hidden Mini Controls (Visible only on hover or when a panel is open) -->
        <div class="quick-actions" id="quick-actions">
          <button
            type="button"
            class="mini-btn"
            id="btn-open-add"
            title="Tambah Pengingat"
            aria-label="Tambah Pengingat"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <button
            type="button"
            class="mini-btn"
            id="btn-open-list"
            title="Daftar Pengingat Aktif"
            aria-label="Daftar Pengingat Aktif"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <circle cx="3.5" cy="6" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="3.5" cy="12" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="3.5" cy="18" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            <span class="mini-badge" id="reminder-count-badge" hidden>0</span>
          </button>

          <!-- Focus / Pomodoro & Ambient Sounds Panel -->
          <button
            type="button"
            class="mini-btn"
            id="btn-open-focus"
            title="Mode Fokus, Pomodoro & Suara Ambient"
            aria-label="Mode Fokus dan Suara Ambient"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"></circle>
              <polyline points="12 9 12 13 15 15"></polyline>
              <line x1="9" y1="2" x2="15" y2="2"></line>
            </svg>
          </button>

          <!-- Pet, Mini Game & PC Health Hub -->
          <button
            type="button"
            class="mini-btn"
            id="btn-open-hub"
            title="Pet Level, Mini Game & Monitor PC"
            aria-label="Pet, Mini Game dan Monitor PC"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="4"></rect>
              <line x1="6" y1="12" x2="10" y2="12"></line>
              <line x1="8" y1="10" x2="8" y2="14"></line>
              <circle cx="15.5" cy="10.5" r="0.9" fill="currentColor" stroke="none"></circle>
              <circle cx="18" cy="13" r="0.9" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>

          <!-- Interactive Robot Voice (Left-click = Talk, Right-click = Toggle Live Mic Vibe) -->
          <button
            type="button"
            class="mini-btn"
            id="btn-voice-talk"
            title="Klik: Robot Bicara • Klik Kanan: Live Mic/Musik Vibe"
            aria-label="Suara dan Animasi Suara Robot"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="4" y1="10" x2="4" y2="14"></line>
              <line x1="8" y1="7" x2="8" y2="17"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
              <line x1="16" y1="7" x2="16" y2="17"></line>
              <line x1="20" y1="10" x2="20" y2="14"></line>
            </svg>
          </button>

          <!-- Theme, Size, Mic Vibe, Clock & Sleep Customize Panel -->
          <button
            type="button"
            class="mini-btn"
            id="btn-open-style"
            title="Tema Warna, Mic Vibe & Kustomisasi"
            aria-label="Tema dan Kustomisasi"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>

          <!-- Dock Position Toggle Widget: Float Center <-> Stick Top Edge -->
          <button
            type="button"
            class="mini-btn"
            id="btn-toggle-dock"
            title="Tempel di Layar Atas"
            aria-label="Ubah posisi widget: Ngambang Tengah atau Nempel Atas"
          >
            <svg class="icon-dock-top" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="4" x2="20" y2="4"></line>
              <polyline points="8 11 12 7 16 11"></polyline>
              <line x1="12" y1="7" x2="12" y2="19"></line>
            </svg>
            <svg class="icon-dock-center" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <rect x="6" y="7" width="12" height="10" rx="3"></rect>
              <line x1="12" y1="2" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22" y2="12"></line>
            </svg>
          </button>
        </div>
      </section>

      <!-- BOTTOM ZONE: Glassmorphism Panels -->
      <section class="panel-zone">
        <!-- 1. Add Reminder Panel -->
        <div class="glass-panel" id="panel-add" aria-hidden="true">
          <form class="reminder-form" id="reminder-form" autocomplete="off">
            <div class="panel-top-row">
              <div class="mode-switch" role="tablist" aria-label="Mode waktu">
                <button
                  type="button"
                  class="mode-tab is-active"
                  id="tab-countdown"
                  data-mode="countdown"
                  role="tab"
                  aria-selected="true"
                >
                  Countdown
                </button>
                <button
                  type="button"
                  class="mode-tab"
                  id="tab-clock"
                  data-mode="clock"
                  role="tab"
                  aria-selected="false"
                >
                  Jam (HH:MM)
                </button>
              </div>
              <button
                type="button"
                class="panel-close-btn"
                data-close-panel
                aria-label="Tutup panel"
              >
                &times;
              </button>
            </div>

            <div class="time-group" id="group-countdown">
              <div class="chip-row">
                <button type="button" class="chip" data-minutes="1">1m</button>
                <button type="button" class="chip is-selected" data-minutes="5">5m</button>
                <button type="button" class="chip" data-minutes="15">15m</button>
                <button type="button" class="chip" data-minutes="30">30m</button>
              </div>
              <div class="input-with-unit">
                <input
                  type="number"
                  id="input-minutes"
                  min="0.1"
                  max="1440"
                  step="any"
                  value="5"
                  aria-label="Durasi dalam menit"
                />
                <span class="unit-label">menit</span>
              </div>
            </div>

            <div class="time-group" id="group-clock" hidden>
              <input
                type="time"
                id="input-clock"
                class="glass-input time-input"
                aria-label="Pilih jam pengingat"
              />
            </div>

            <div class="message-row">
              <input
                type="text"
                id="input-message"
                class="glass-input message-input"
                placeholder="Pesan pengingat..."
                maxlength="90"
                required
              />
              <button type="submit" class="btn-save" id="btn-save">
                Set
              </button>
            </div>
          </form>
        </div>

        <!-- 2. Active Reminders & Quick To-Do Panel -->
        <div class="glass-panel" id="panel-list" aria-hidden="true">
          <div class="panel-top-row">
            <div class="mode-switch" role="tablist" aria-label="Daftar Pengingat dan To-Do">
              <button type="button" class="mode-tab is-active" data-list-tab="reminders">Pengingat</button>
              <button type="button" class="mode-tab" data-list-tab="todos">To-Do</button>
            </div>
            <button
              type="button"
              class="panel-close-btn"
              data-close-panel
              aria-label="Tutup daftar"
            >
              &times;
            </button>
          </div>

          <div class="tab-view" id="view-reminders">
            <div class="reminder-list" id="reminder-list"></div>
          </div>

          <div class="tab-view" id="view-todos" hidden>
            <form class="todo-form" id="todo-form" autocomplete="off">
              <input
                type="text"
                id="input-todo"
                class="glass-input todo-input"
                placeholder="Tambah tugas harian..."
                maxlength="70"
                required
              />
              <button type="submit" class="btn-save btn-todo-add">+</button>
            </form>
            <div class="reminder-list todo-list" id="todo-list"></div>
          </div>
        </div>

        <!-- 3. Focus / Pomodoro & Ambient Sounds Panel -->
        <div class="glass-panel" id="panel-focus" aria-hidden="true">
          <div class="panel-top-row">
            <div class="mode-switch" role="tablist" aria-label="Pomodoro dan Ambient">
              <button type="button" class="mode-tab is-active" data-focus-tab="pomodoro">Pomodoro</button>
              <button type="button" class="mode-tab" data-focus-tab="ambient">Suara Fokus</button>
            </div>
            <button
              type="button"
              class="panel-close-btn"
              data-close-panel
              aria-label="Tutup fokus"
            >
              &times;
            </button>
          </div>

          <!-- Pomodoro Sub-View -->
          <div class="tab-view" id="view-pomodoro">
            <div class="chip-row">
              <button type="button" class="chip is-selected" data-pomo-preset="focus">25m</button>
              <button type="button" class="chip" data-pomo-preset="break">Rehat 5m</button>
              <button type="button" class="chip" data-pomo-preset="deep">Deep 50m</button>
            </div>
            <div class="pomo-display">
              <span class="pomo-time" id="pomo-time">25:00</span>
              <span class="pomo-status" id="pomo-status">Siap Fokus</span>
            </div>
            <div class="pomo-actions">
              <button type="button" class="btn-save pomo-main-btn" id="btn-pomo-toggle">
                Mulai Fokus
              </button>
              <button type="button" class="btn-ghost" id="btn-pomo-reset">
                Reset
              </button>
            </div>
          </div>

          <!-- Ambient Soundscapes Sub-View -->
          <div class="tab-view" id="view-ambient" hidden>
            <div class="ambient-grid">
              <button type="button" class="ambient-btn" data-ambient="rain">
                <span>🌧</span><span>Hujan</span>
              </button>
              <button type="button" class="ambient-btn" data-ambient="brown">
                <span>🎧</span><span>Brown</span>
              </button>
              <button type="button" class="ambient-btn" data-ambient="ocean">
                <span>🌊</span><span>Ombak</span>
              </button>
            </div>
            <div class="volume-row">
              <span class="volume-label">Volume</span>
              <input
                type="range"
                id="ambient-volume"
                class="volume-slider"
                min="0.08"
                max="1"
                step="0.02"
                value="0.4"
                aria-label="Volume suara ambient"
              />
              <button type="button" class="btn-ghost btn-stop-amb" id="btn-ambient-off">
                Stop
              </button>
            </div>
          </div>
        </div>

        <!-- 4. Pet, Mini Game & Real-Time PC Monitor Hub Panel -->
        <div class="glass-panel" id="panel-hub" aria-hidden="true">
          <div class="panel-top-row">
            <div class="mode-switch" role="tablist" aria-label="Pet, Game dan PC">
              <button type="button" class="mode-tab is-active" data-hub-tab="pet">Pet</button>
              <button type="button" class="mode-tab" data-hub-tab="game">Suit</button>
              <button type="button" class="mode-tab" data-hub-tab="pc">PC Info</button>
            </div>
            <button
              type="button"
              class="panel-close-btn"
              data-close-panel
              aria-label="Tutup hub"
            >
              &times;
            </button>
          </div>

          <!-- Pet & Friendship XP View -->
          <div class="tab-view" id="view-pet">
            <div class="pet-header">
              <span class="pet-level-badge" id="pet-level-badge">Lv. 1</span>
              <span class="pet-title" id="pet-title">Kenalan Baru</span>
              <span class="pet-xp-text" id="pet-xp-text">0/60 XP</span>
            </div>
            <div class="meter-row">
              <span class="meter-label">XP</span>
              <div class="meter-track"><div class="meter-fill" id="pet-xp-fill"></div></div>
            </div>
            <div class="meter-row">
              <span class="meter-label">Energi</span>
              <div class="meter-track"><div class="meter-fill meter-energy" id="pet-energy-fill"></div></div>
              <span class="meter-val" id="pet-energy-val">86%</span>
            </div>
            <button type="button" class="btn-save pet-feed-btn" id="btn-feed-snack">
              ⚡ Kasih Snack Listrik (+Energi &amp; XP)
            </button>
          </div>

          <!-- Mini Game (Suit + Coin Flip + Buddy Shows) View -->
          <div class="tab-view" id="view-game" hidden>
            <div class="game-score-row">
              <span class="game-result" id="game-result">Pilih Suit lawan Robot!</span>
              <span class="game-score" id="game-score">0 - 0</span>
            </div>
            <div class="suit-row">
              <button type="button" class="suit-btn" data-suit="batu">✊ Batu</button>
              <button type="button" class="suit-btn" data-suit="gunting">✌ Gunting</button>
              <button type="button" class="suit-btn" data-suit="kertas">✋ Kertas</button>
            </div>
            <div class="buddy-show-row">
              <button type="button" class="buddy-chip" data-buddy-show="suit" title="2 Robot Suit Sendiri">✊ Suit Bot</button>
              <button type="button" class="buddy-chip" data-buddy-show="flower" title="Kasih Bunga Baper">🌸 Bunga</button>
              <button type="button" class="buddy-chip" data-buddy-show="movie" title="Nonton Bareng 3D">🎬 Nonton</button>
              <button type="button" class="buddy-chip" data-buddy-show="scare" title="Nakutin Temen!">👻 Boo</button>
              <button type="button" class="buddy-chip" id="btn-flip-coin" title="Lempar Koin">🪙</button>
            </div>
          </div>

          <!-- Real-Time PC Monitor View -->
          <div class="tab-view" id="view-pc" hidden>
            <div class="meter-row">
              <span class="meter-label">CPU</span>
              <div class="meter-track"><div class="meter-fill" id="pc-cpu-fill"></div></div>
              <span class="meter-val" id="pc-cpu-val">--%</span>
            </div>
            <div class="meter-row">
              <span class="meter-label">RAM</span>
              <div class="meter-track"><div class="meter-fill" id="pc-ram-fill"></div></div>
              <span class="meter-val" id="pc-ram-val">--%</span>
            </div>
            <div class="meter-row">
              <span class="meter-label">Baterai</span>
              <div class="meter-track"><div class="meter-fill meter-energy" id="pc-bat-fill"></div></div>
              <span class="meter-val" id="pc-bat-val">--%</span>
            </div>
            <div class="pc-footnote" id="pc-footnote">Memantau performa PC real-time...</div>
          </div>
        </div>

        <!-- 4. Customize Panel (Neon Themes, Size, Mic Vibe, Clock, Greetings, Sleep) -->
        <div class="glass-panel" id="panel-style" aria-hidden="true">
          <div class="panel-top-row">
            <span class="panel-title">Kustomisasi &amp; Mode</span>
            <button
              type="button"
              class="panel-close-btn"
              data-close-panel
              aria-label="Tutup kustomisasi"
            >
              &times;
            </button>
          </div>

          <!-- Theme Swatches & Size + Buddy Controls -->
          <div class="style-row">
            <div class="swatch-group" role="radiogroup" aria-label="Tema warna neon">
              <button type="button" class="swatch is-active" data-theme-pick="cyan" title="Cyber Cyan"></button>
              <button type="button" class="swatch" data-theme-pick="sakura" title="Sakura Pink"></button>
              <button type="button" class="swatch" data-theme-pick="emerald" title="Matrix Emerald"></button>
              <button type="button" class="swatch" data-theme-pick="violet" title="Nebula Violet"></button>
              <button type="button" class="swatch" data-theme-pick="gold" title="Cyber Gold"></button>
            </div>
            <div class="style-mini-actions">
              <button type="button" class="size-toggle-btn" id="btn-spawn-buddy" title="Munculkan robot ke-2 untuk saling berinteraksi">
                +Buddy
              </button>
              <button type="button" class="size-toggle-btn" id="btn-toggle-size" title="Ganti ukuran robot">
                Normal
              </button>
            </div>
          </div>

          <!-- 3x2 Smart Feature Toggles -->
          <div class="feature-grid">
            <button type="button" class="feature-pill" id="btn-toggle-mic">
              <span class="pill-dot"></span>
              <span id="mic-pill-label">Mic Vibe</span>
            </button>
            <button type="button" class="feature-pill" id="btn-toggle-clock">
              <span class="pill-dot"></span>
              <span>Jam</span>
            </button>
            <button type="button" class="feature-pill" id="btn-toggle-greet">
              <span class="pill-dot"></span>
              <span>Sapaan</span>
            </button>
            <button type="button" class="feature-pill" id="btn-toggle-mood">
              <span class="pill-dot"></span>
              <span>Auto Mood</span>
            </button>
            <button type="button" class="feature-pill" id="btn-trigger-sad">
              <span>Sedih</span>
            </button>
            <button type="button" class="feature-pill" id="btn-trigger-sleep">
              <span>Zzz Tidur</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
